name: Deploy to Cloud Run

# Manual deploys only. Setup (Workload Identity Federation, secrets) is
# described in docs/DEPLOYMENT.md.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  SERVICE: setupops
  REGION: europe-west3

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          source: .
          flags: --allow-unauthenticated --memory=512Mi --max-instances=3
          secrets: |-
            GEMINI_API_KEY=gemini-api-key:latest

      - name: Smoke test
        run: curl --fail --silent --show-error "${{ steps.deploy.outputs.url }}/" > /dev/null

      - run: echo "Deployed to ${{ steps.deploy.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
